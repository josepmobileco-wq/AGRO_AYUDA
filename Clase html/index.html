<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRO AYUDA - Iniciar sesión</title>
<link rel="stylesheet" href="estilos.css"/>
</head>
<body>
<!-- Tarjeta centrada con 2 columnas como el mockup -->
<div class="tarjeta">
  <!-- IZQUIERDA: imagen completa del mockup -->
  <div class="izquierda">
    <img src="imagen de inicio con logo.png" alt="AGRO AYUDA - Del campo a tu mesa">
  </div>

  <!-- DERECHA: formulario -->
  <div class="derecha">
    <h2>Iniciar sesión</h2>
    <p class="gris">Ingresa con tus datos para continuar</p>

    <label>Correo electrónico</label>
    <input type="email" placeholder="ejemplo@correo.com">

    <label>Contraseña</label>
    <div class="pass">
      <input type="password" placeholder="•••••••">
      <span>👁️</span>
    </div>

    <div class="fila">
      <span><input type="checkbox" checked> Recordar sesión</span>
      <a href="olvido-password.html">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="verde">Iniciar sesión</button>

    <p class="centro gris">o continúa con</p>
    <div class="social">
      <button class="blanco">G Google</button>
      <button class="blanco">f Facebook</button>
    </div>

    <p class="centro">¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
  
  </div>
</div>
</body>
</html>
