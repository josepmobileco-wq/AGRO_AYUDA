<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRO AYUDA - Mi carrito</title>
<link rel="stylesheet" href="estilos.css"/>
</head>
<body>
<div class="cart-page">
  <nav class="cart-navbar">
    <div class="cart-logo"><img src="logoagroayuda.jpeg" alt=""> AGRO AYUDA</div>
    <input type="text" class="cart-search" placeholder="Buscar productos, categorías...">
    <div class="cart-actions"><span>🛒</span><span>🔔</span><span>👤</span></div>
  </nav>
  <main class="cart-container">
    <div class="cart-top"><h1>Mi carrito (3)</h1><a href="#">Vaciar carrito</a></div>
    <div class="cart-grid">
      <section class="cart-list">
        <div class="cart-item" id="tomate">
          <img src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=200&q=80" alt="Tomate">
          <div><b>Tomate chonto</b><br><small>$2.500 / kg</small><div id="precio-tomate">$2.500</div></div>
          <div class="cart-qty"><button onclick="cambiar('tomate',-1)">−</button><span id="cantidad-tomate">1</span><button onclick="cambiar('tomate',1)">+</button></div>
          <button onclick="eliminar('tomate')">🗑</button>
        </div>
        <div class="cart-item" id="lechuga">
          <img src="lechuga.jpg" alt="Lechuga">
          <div><b>Lechuga</b><br><small>$1.800 / unidad</small><div id="precio-lechuga">$1.800</div></div>
          <div class="cart-qty"><button onclick="cambiar('lechuga',-1)">−</button><span id="cantidad-lechuga">1</span><button onclick="cambiar('lechuga',1)">+</button></div>
          <button onclick="eliminar('lechuga')">🗑</button>
        </div>
        <div class="cart-item" id="zanahoria">
          <img src="https://images.unsplash.com/photo-1445282768818-728615cc910a?auto=format&fit=crop&w=200&q=80" alt="Zanahoria">
          <div><b>Zanahoria</b><br><small>$1.200 / kg</small><div id="precio-zanahoria">$1.200</div></div>
          <div class="cart-qty"><button onclick="cambiar('zanahoria',-1)">−</button><span id="cantidad-zanahoria">1</span><button onclick="cambiar('zanahoria',1)">+</button></div>
          <button onclick="eliminar('zanahoria')">🗑</button>
        </div>
      </section>
      <aside class="cart-summary">
        <h2>Resumen de compra</h2>
        <p>Subtotal <span id="subtotal">$5.500</span></p>
        <p>Envío <span>$4.500</span></p>
        <p>Total <span id="total">$10.000</span></p>
        <button class="verde" onclick="continuar()">Continuar con la compra</button>
      </aside>
    </div>
  </main>
</div>
<script>
let productos={tomate:{precio:2500,cantidad:1},lechuga:{precio:1800,cantidad:1},zanahoria:{precio:1200,cantidad:1}};
const envio=4500;
function cambiar(n,c){productos[n].cantidad+=c;if(productos[n].cantidad<1)productos[n].cantidad=1;document.getElementById("cantidad-"+n).textContent=productos[n].cantidad;document.getElementById("precio-"+n).textContent="$"+(productos[n].precio*productos[n].cantidad).toLocaleString("es-CO");actualizar();}
function actualizar(){let s=0,q=0;for(let n in productos){s+=productos[n].precio*productos[n].cantidad;q+=productos[n].cantidad;}document.getElementById("subtotal").textContent="$"+s.toLocaleString("es-CO");document.getElementById("total").textContent="$"+(s+envio).toLocaleString("es-CO");document.querySelector(".cart-top h1").textContent="Mi carrito ("+q+")";}
function eliminar(n){document.getElementById(n).remove();delete productos[n];actualizar();}
function continuar(){if(Object.keys(productos).length===0){alert("Tu carrito está vacío.");return;}window.location.href='pago.html';}
</script>
</body>
</html>
